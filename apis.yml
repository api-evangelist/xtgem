aid: xtgem
name: XtGem
description: XtGem is a visual mobile website builder operated by UAB XtGem of Vilnius,
  Lithuania, letting anyone build and host mobile sites on *.xtgem.com subdomains
  (10 million+ sites hosted) with a drag-and-drop builder, file hosting, community
  blocks (forums, blogs, guestbooks), and the XtScript templating language. XtGem
  publishes no public developer API, webhooks, or SDKs; its GitHub organization
  ships the open-source XtFramework PHP framework.
